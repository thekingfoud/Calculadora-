<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Pro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator-wrapper">

    <!-- HEADER -->
    <div class="calc-header">
        <h1>Calculadora <span>Pro</span></h1>
        <p>Operaciones matemáticas básicas</p>
        <button id="btn-prompt" class="btn-prompt">Modo Interactivo</button>
    </div>

    <!-- CALCULADORA -->
    <div class="calculator">

        <!-- DISPLAY -->
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>

        <!-- BOTONES -->
        <div class="buttons">

            <button class="btn btn-action" data-action="clear">AC</button>
            <button class="btn btn-action" data-action="delete">DEL</button>
            <button class="btn btn-operator" data-operation="/">÷</button>
            <button class="btn btn-operator" data-operation="*">×</button>

            <button class="btn" data-number="7">7</button>
            <button class="btn" data-number="8">8</button>
            <button class="btn" data-number="9">9</button>
            <button class="btn btn-operator" data-operation="-">−</button>

            <button class="btn" data-number="4">4</button>
            <button class="btn" data-number="5">5</button>
            <button class="btn" data-number="6">6</button>
            <button class="btn btn-operator" data-operation="+">+</button>

            <button class="btn" data-number="1">1</button>
            <button class="btn" data-number="2">2</button>
            <button class="btn" data-number="3">3</button>
            <button class="btn btn-equals span-v" data-action="equals">=</button>

            <button class="btn span-two" data-number="0">0</button>
            <button class="btn" data-number=".">.</button>

        </div>

    </div>

    <!-- HISTORIAL -->
    <div class="history-container">
        <h3>Historial</h3>
        <ul id="history-list">
            <li class="empty-msg">Sin operaciones aún</li>
        </ul>
    </div>

</div>

<!-- SCRIPTS (orden importante) -->
<script src="js/calculadora.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
